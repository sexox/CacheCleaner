
name: Extract ZIP Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract ZIP automatically
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d .

          echo "Extraction completed successfully!"

      - name: Show extracted files
        run: |
          echo "Repository files:"
          ls -la
          find . -maxdepth 3 -name pubspec.yaml
