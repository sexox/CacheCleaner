
name: Build SMART SCHOOL ZONE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "ZIP extracted successfully"

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Locate Flutter project
      - name: Find Flutter project
        shell: bash
        run: |
          APP_DIR=$(find source -type f -name pubspec.yaml -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            echo "Extracted files:"
            find source -maxdepth 4 -type f | head -200
            exit 1
          fi

          APP_DIR=$(dirname "$APP_DIR")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Flutter project: $APP_DIR"

      # 6. Prepare Android
      - name: Prepare Android platform
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

      # 7. Fix intl conflict
      - name: Fix intl dependency
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub add intl:^0.20.3

      # 8. Install dependencies
      - name: Install Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get

      # 9. Check Flutter project
      - name: Analyze Flutter project
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter analyze --no-pub

      # 10. Build APK
      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-SCHOOL-ZONE-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
