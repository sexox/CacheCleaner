
name: Build SMART SCHOOL ZONE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        shell: bash
        run: |
          PUBSPEC=$(find source -type f -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # إصلاح intl قبل إنشاء Android
      - name: Fix intl dependency
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub add 'intl:^0.20.3'

      - name: Prepare Android platform
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-pub

      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-SCHOOL-ZONE-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
