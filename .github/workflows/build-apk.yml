
name: Build SMART SCHOOL ZONE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        run: |
          APP_DIR=$(find source -type f -name pubspec.yaml -print -quit | xargs -r dirname)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      
      - name: Fix intl dependency
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub add intl:^0.20.3

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-SCHOOL-ZONE-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
